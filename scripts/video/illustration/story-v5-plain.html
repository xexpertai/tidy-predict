<!doctype html><html><head><meta charset="utf-8"><title>Illustration</title>
<style>
@font-face{font-family:Caveat;src:url(../assets/Caveat.ttf);font-weight:400 700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1564px;height:880px;overflow:hidden;background:#e8d9bd;font-family:Caveat,cursive}
#desk{position:absolute;inset:0;background:
 repeating-linear-gradient(90deg,rgba(120,80,40,.05) 0 3px,transparent 3px 120px),
 linear-gradient(#ecdfc6,#dcc9a4)}
.fadein{animation:fi .5s ease-out both}@keyframes fi{from{opacity:0}to{opacity:1}}
h1{position:absolute;left:0;right:0;top:26px;text-align:center;font-size:84px;font-weight:700;color:#2b2a27;letter-spacing:1px}
h1 span{background:linear-gradient(transparent 58%,#ffd84d 58%);padding:0 10px}
h1 .w{display:inline-block;opacity:0;animation:fi .25s forwards}
/* notebook */
#nb{position:absolute;left:56px;top:170px;width:600px;height:660px;background:#fffdf3;border-radius:6px;
 transform:rotate(-2deg);box-shadow:6px 10px 24px rgba(60,40,10,.35);
 background-image:repeating-linear-gradient(transparent 0 55px,#b9cfe6 55px 57px);background-position:0 70px}
#nb:before{content:"";position:absolute;left:62px;top:0;bottom:0;width:3px;background:#e07a7a}
#nb h2{position:absolute;left:84px;top:8px;font-size:52px;color:#2d3f6b;font-weight:700}
.row{position:absolute;left:84px;font-size:46px;color:#233a7a;white-space:nowrap}
.row svg{position:absolute;left:330px;top:-2px;overflow:visible}
.tally path{stroke:#233a7a;stroke-width:5;stroke-linecap:round;fill:none;stroke-dasharray:60;stroke-dashoffset:60}
.scrib{stroke:#d62b2b;stroke-width:6;stroke-linecap:round;fill:none;stroke-dasharray:420;stroke-dashoffset:420}
.q{position:absolute;font-size:60px;color:#d62b2b;font-weight:700;opacity:0}
/* phone */
#ph{position:absolute;left:720px;top:250px;width:250px;height:520px;background:#26282d;border-radius:34px;
 transform:rotate(3deg);box-shadow:6px 10px 24px rgba(60,40,10,.4);padding:22px 16px}
#disp{height:110px;background:#10151a;border-radius:14px;color:#9be6a8;font:700 66px/110px monospace;text-align:right;padding-right:16px}
#keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
#keys i{display:block;height:56px;border-radius:50%;background:#4a4e57}
#keys i:nth-child(4n){background:#e3893b}
#keys i.p{background:#fff}
/* shelves */
.shelf{position:absolute;width:260px;height:14px;background:#8a5a2b;border-radius:3px;box-shadow:0 8px 12px rgba(60,40,10,.3)}
.post{position:absolute;width:12px;background:#7a4d22;top:330px;height:480px}
.box{position:absolute;width:104px;height:78px;background:#c99a5e;border:3px solid #9b6f3a;border-radius:4px;opacity:0}
.box:after{content:"";position:absolute;left:0;right:0;top:26px;height:10px;background:rgba(255,255,255,.35)}
.tag{position:absolute;background:#fff8dc;border:2px solid #8a6d2b;padding:2px 14px;font-size:34px;color:#4a3a14;border-radius:4px;opacity:0;transform:rotate(-3deg);box-shadow:2px 4px 8px rgba(0,0,0,.2)}
.sold{background:#d62b2b;color:#fff;border-color:#a31c1c;font-weight:700;font-size:44px;letter-spacing:3px;transform:rotate(-6deg)}
.empty{position:absolute;font-size:30px;color:#7a5a2d;opacity:0}
.cap{position:absolute;font-size:36px;color:#5b4a2a}
/* next scene */
#next{display:none}
#next #nb2{position:absolute;left:300px;top:60px;width:960px;height:770px;background:#fffdf3;border-radius:8px;transform:rotate(-1deg);
 box-shadow:8px 14px 30px rgba(60,40,10,.4);background-image:repeating-linear-gradient(transparent 0 79px,#b9cfe6 79px 81px);background-position:0 100px}
#nb2:before{content:"";position:absolute;left:90px;top:0;bottom:0;width:3px;background:#e07a7a}
#nb2 h2{position:absolute;left:130px;top:20px;font-size:84px;color:#2d3f6b}
.line{position:absolute;left:130px;font-size:54px;color:#233a7a;opacity:0;white-space:nowrap}
.line b{display:inline-block;width:52px;height:52px;border:5px solid #233a7a;border-radius:8px;margin-right:22px;vertical-align:-8px;position:relative}
.line b:after{content:"";position:absolute;left:8px;top:-12px;width:20px;height:40px;border:solid #1d9b57;border-width:0 8px 8px 0;transform:rotate(40deg) scale(0);transform-origin:bottom right;animation:tick .3s forwards;animation-delay:var(--d)}
@keyframes tick{to{transform:rotate(40deg) scale(1)}}
.mark{position:absolute;right:70px;bottom:36px;font-size:44px;color:#9a8a68;transform:rotate(-2deg)}
</style></head><body>
<div id="desk"></div>
<div id="hook">
 <h1><span class="w" style="animation-delay:.2s">Counting</span> <span class="w" style="animation-delay:.45s">stock</span> <span class="w" style="animation-delay:.7s">by</span> <span class="w" style="animation-delay:.95s">hand</span> <span class="w" style="animation-delay:1.2s">=</span> <span class="w" style="animation-delay:1.45s">guessing</span></h1>
 <div id="nb" class="fadein" style="animation-delay:.1s"><h2>Stock register</h2></div>
 <div id="ph" class="fadein" style="animation-delay:.3s"><div id="disp">?</div><div id="keys"></div></div>
 <div class="post" style="left:1010px"></div><div class="post" style="left:1260px"></div><div class="post" style="left:1490px"></div>
 <div class="shelf" style="left:1000px;top:560px"></div><div class="shelf" style="left:1000px;top:760px"></div>
 <div class="shelf" style="left:1250px;top:560px"></div><div class="shelf" style="left:1250px;top:760px"></div>
 <div class="empty" id="empt" style="left:1030px;top:490px">(nothing left)</div>
 <div class="tag" id="t1" style="left:1010px;top:612px">Rabbit night light</div>
 <div class="tag sold" id="t2" style="left:1018px;top:690px">SOLD OUT</div>
 <div class="tag" id="t3" style="left:1250px;top:318px;z-index:5">nobody asked for these</div>
 <div id="boxes"></div>
</div>
<div id="next">
 <div id="nb2" class="fadein"><h2>Next week:</h2></div>
</div>
<script>
const S=new URLSearchParams(location.search).get('s')||'hook';
const NS="http://www.w3.org/2000/svg";
const $=(q)=>document.querySelector(q);
function later(ms,f){setTimeout(f,ms)}
if(S==='hook'){
 // keys
 const keys=$('#keys'); for(let i=0;i<20;i++){keys.appendChild(document.createElement('i'))}
 // rows
 const items=["Rabbit night light","Popcorn holder","Red harmonica","Paper chain kit"];
 const nb=$('#nb');
 items.forEach((n,i)=>{
  const top=96+i*114, r=document.createElement('div'); r.className='row'; r.style.top=top+'px'; r.textContent=n;
  r.style.opacity=0; r.style.animation='fi .4s forwards'; r.style.animationDelay=(.5+i*.3)+'s';
  const s=document.createElementNS(NS,'svg'); s.setAttribute('class','tally'); s.setAttribute('width',230); s.setAttribute('height',60);
  const n1=4+i%2;
  for(let k=0;k<n1;k++){const p=document.createElementNS(NS,'path'); p.setAttribute('d',`M${14+k*22} 8 l${(k%2?3:-2)} 42`); p.style.animation=`dr .3s forwards`; p.style.animationDelay=(1.1+i*.5+k*.12)+'s'; s.appendChild(p)}
  if(n1>=5){const p=document.createElementNS(NS,'path');p.setAttribute('d','M4 40 L110 14');p.style.animation='dr .3s forwards';p.style.animationDelay=(1.1+i*.5+.7)+'s';s.appendChild(p)}
  // scribble over
  if(i<3){const sc=document.createElementNS(NS,'path'); sc.setAttribute('class','scrib'); sc.setAttribute('d','M0 30 C40 -4 70 60 110 16 S170 56 220 20 M0 44 C50 10 80 62 130 28 S190 50 225 36'); sc.style.animation='sc .7s forwards'; sc.style.animationDelay=(3.0+i*.45)+'s'; s.appendChild(sc)}
  r.appendChild(s); nb.appendChild(r);
  if(i<3){const q=document.createElement('div'); q.className='q'; q.textContent='?'; q.style.left=(84+330+245)+'px'; q.style.top=(top-8)+'px'; q.style.animation='fi .3s forwards'; q.style.animationDelay=(3.5+i*.45)+'s'; nb.appendChild(q)}
 });
 const st=document.createElement('style'); st.textContent='@keyframes dr{to{stroke-dashoffset:0}}@keyframes sc{to{stroke-dashoffset:0}}@keyframes drop{0%{opacity:1;transform:translateY(-420px)}60%{opacity:1;transform:translateY(0)}78%{transform:translateY(-16px)}100%{opacity:1;transform:translateY(0)}}';
 document.head.appendChild(st);
 // calculator presses
 const ks=[...keys.children]; const seq=[3,7,10,14,2,9,13,5,16,11,6,17];
 seq.forEach((k,j)=>later(1800+j*330,()=>{ks[k].classList.add('p');later(160,()=>ks[k].classList.remove('p'));
   $('#disp').textContent=['?','??','???','?'][j%4]}));
 // shelves
 later(3800,()=>{$('#empt').style.transition='opacity .4s';$('#empt').style.opacity=1;['t1','t2'].forEach((id,j)=>later(j*500,()=>{const e=$('#'+id);e.style.transition='opacity .3s';e.style.opacity=1}))});
 later(4600,()=>{$('#t3').style.transition='opacity .3s';$('#t3').style.opacity=1});
 // boxes pile (right shelves: x 1260..1500)
 const pos=[[1270,682],[1380,682],[1270,604-0],[1380,604],[1325,526],[1270,780-78+0]];
 const spots=[[1262,682],[1370,682],[1262,482],[1370,482],[1316,404],[1262,882]];
 const bx=$('#boxes'); const place=[[1262,482+0],[1370,482],[1316,404]];
 const lower=[[1262,682],[1370,682],[1316,604],[1262,604+0]];
 const all=[[1262,682],[1370,682],[1316,604+0]];
 const final=[[1262,682],[1370,682],[1316,604],[1262,604],[1370,604],[1316,526]];
 // shelf tops: lower shelf y=760 -> box top 682; upper shelf y=560 -> box top 482
 const pile=[[1262,682],[1370,682],[1316,604],[1262,482],[1370,482],[1316,404],[1262,604]];
 pile.forEach((p,j)=>{const b=document.createElement('div');b.className='box';b.style.left=p[0]+'px';b.style.top=p[1]+'px';
   b.style.animation='drop .55s ease-in forwards';b.style.animationDelay=(4.9+j*.38)+'s';bx.appendChild(b)});
}
if(S==='next'){
 $('#hook').style.display='none'; $('#next').style.display='block';
 const n=$('#next'); const L=[
  ["Stock up to the busy-week number",1.0],
  ["Spare stock for items that beat their range",2.3],
  ["Check the shelf myself, every week",3.6]];
 L.forEach(([t,d],i)=>{const e=document.createElement('div');e.className='line';e.style.top=(150+i*120)+'px';e.style.setProperty('--d',(d+.5)+'s');
  e.innerHTML='<b></b>'+t;e.style.animation='fi .5s forwards';e.style.animationDelay=d+'s';$('#nb2').appendChild(e)});
 const m=document.createElement('div');m.className='mark';m.textContent='Meera (fictional)';$('#nb2').appendChild(m);
}
</script></body></html>
